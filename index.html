<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Uploader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Image Uploader</h1>
    <p class="subtitle">Upload and preview your images instantly</p>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📁</div>
      <p class="upload-text">Drag &amp; drop images here</p>
      <p class="upload-subtext">or</p>
      <label for="fileInput" class="browse-btn">Browse Files</label>
      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
        hidden
      />
      <p class="upload-hint">Supports JPG, PNG, GIF, WebP, SVG</p>
    </div>

    <div class="gallery" id="gallery" hidden>
      <div class="gallery-header">
        <h2>Uploaded Images (<span id="imageCount">0</span>)</h2>
        <button class="clear-btn" id="clearAllBtn">Clear All</button>
      </div>
      <div class="image-grid" id="imageGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
